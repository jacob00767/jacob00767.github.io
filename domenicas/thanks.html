<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | Domenicas Home Refresh</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap">
<style>
:root { --bg: #faf8fb; --ink: #2f2c33; --muted: #6c6672; --purple: #6a3d9a; --on-purple: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #17141b; --ink: #f2eef6; --muted: #b3aabd; --purple: #b993e6; --on-purple: #17141b; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.7 "Montserrat", system-ui, sans-serif; text-align: center; padding: 24px 16px; }
img { width: 140px; height: 140px; border-radius: 50%; }
h1 { font: 400 clamp(48px, 9vw, 72px)/1 "Great Vibes", cursive; color: var(--purple); margin: 18px 0 10px; }
p { color: var(--muted); max-width: 28em; margin: 0 auto 24px; }
a { display: inline-block; background: var(--purple); color: var(--on-purple); text-decoration: none; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; padding: 15px 24px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Domenicas Home Refresh logo">
  <h1>Thank you!</h1>
  <p>Your request is in. I'll reach out soon to set up your free walkthrough.</p>
  <a href="/">Back to the site</a>
</main>
</body>
</html>
